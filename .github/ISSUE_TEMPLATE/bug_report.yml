name: Bug 报告
description: 报告一个问题，帮助我们改进 k8s-inspector
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有相同问题。
        请勿在 Issue 中粘贴企业微信 Webhook、Dify API Key 等敏感信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 设置环境变量 ...
        2. 执行命令 ...
        3. 观察到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 执行 `./inspector --version` 或提供提交哈希
      placeholder: 例如 dev / v0.1.0 / fcbad18
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Go 版本、Kubernetes 版本、部署方式（本地 / Docker / CronJob）
      placeholder: 例如 Linux amd64 / Go 1.23.9 / K8s 1.28 / CronJob
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 相关错误日志（注意脱敏）
      render: shell
    validations:
      required: false
