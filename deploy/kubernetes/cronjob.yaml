---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-inspector
  namespace: k8s
  labels:
    app.kubernetes.io/name: k8s-inspector
    app.kubernetes.io/component: inspector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-inspector
  labels:
    app.kubernetes.io/name: k8s-inspector
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces", "componentstatuses"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-inspector
  labels:
    app.kubernetes.io/name: k8s-inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: k8s
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-inspector
  namespace: k8s
  labels:
    app.kubernetes.io/name: k8s-inspector
    app.kubernetes.io/component: inspector
spec:
  schedule: "30 9,18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: k8s-inspector
          initContainers:
          - name: fix-permissions
            image: harbor.xx/ic/alpine:3.19.7
            command: ["sh", "-c", "mkdir -p /app/reports && chown -R 700:700 /app/reports"]
            resources:
              requests:
                cpu: 50m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
            volumeMounts:
            - name: reports
              mountPath: /app/reports
          containers:
          - name: inspector
            image: harbor.xx/ic/inspector:v2.0
            env:
            - name: DIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dify-key
                  key: api_key
            - name: DIFY_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: dify-url
                  key: base_url
            - name: WECHAT_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: wechatiser
                  key: webhook-url
            - name: PROMETHEUS_URL
              value: "http://prometheus-k8s-monitoring-apps.xx"
            - name: CLUSTER_NAME
              value: kubernetes
            - name: REPORT_CLUSTER_NAME
              value: "K8s业务集群"
            - name: CRITICAL_THRESHOLD
              value: "90"
            - name: WARNING_THRESHOLD
              value: "80"
            - name: MAX_CONCURRENCY
              value: "10"
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: reports
              mountPath: /app/reports
          volumes:
          - name: reports
            persistentVolumeClaim:
              claimName: inspection-reports
          nodeSelector:
            ainspector: "true"